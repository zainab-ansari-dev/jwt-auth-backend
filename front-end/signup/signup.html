<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>signup</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="signin-container">
    <div class="sign-in-page">
        <h2>Sign In</h2>
        <form  class="sign-in-form" autocomplete="off">
            <label for="username">full name</label>
            <input id="username" type="text" placeholder="enter your full name here...">

            <label for="email">Email</label>
            <input id = "email" type="email" placeholder="enter your email here...">

            <label for="password">password</label>
            <input id="password" type="password" placeholder="enter your password here...">
            <button class="submit-signin-form" type="submit">sign in</button>
        </form>
        <p> already have an account?
            <a href="../login/login.html" id="go-to-login">login here</a>
        </p>
    </div></div>
    <script type="module" src="signup.js"></script>
</body>
</html>
